%YAML:1.0

#--------------------------------------------------------------------------------------------
# HILTI-Trimble SLAM Challenge 2026 — cam0 (mono-inertial), UNDISTORTED to pinhole.
# OpenMAVIS (ORB-SLAM3 fork) front-end, SLAM_ALG=openmavis.
#
# IMPORTANT: the Hilti cam0 is a Leica ~200 deg fisheye (Insta360 One-RS 1-inch).
# Feeding the RAW fisheye to ORB as a KannalaBrandt8 camera makes tracking collapse
# ("Fail to track local map" storms -> unstable VIO init -> segfault). So the node
# UNDISTORTS each frame to a virtual PINHOLE (cv::fisheye::initUndistortRectifyMap,
# R = I so the optical frame / IMU.T_b_c1 is unchanged) BEFORE tracking. This config
# therefore describes the VIRTUAL PINHOLE that the node feeds ORB, NOT the raw fisheye.
#
# Undistort params (must match the node's fisheye_* / pinhole_* params, both default
# to these values). Source fisheye + target pinhole from the proven DROID-W recipe
# (project_droidw_hilti_fisheye_undistort) and $GROUP/hilti/calib.txt:
#   source fisheye K  = fx 465.30  fy 465.32  cx 730.05  cy 720.14
#   source fisheye D  = [0.0258, -0.01091, -0.00169, 0.0001477]  (equidistant/KB8)
#   target pinhole Knew = fx 700  fy 700  cx 736  cy 720   (HFoV ~92 deg, 0% black border)
#   output size = 1472 x 1440 (same as input)
#--------------------------------------------------------------------------------------------
File.version: "1.0"

Camera.type: "PinHole"

# Virtual pinhole intrinsics (post-undistort target Knew = calib.txt "700 700 736 720").
Camera1.fx: 700.0
Camera1.fy: 700.0
Camera1.cx: 736.0
Camera1.cy: 720.0

# No distortion: the node hands ORB an already-rectified pinhole image.
Camera1.k1: 0.0
Camera1.k2: 0.0
Camera1.p1: 0.0
Camera1.p2: 0.0

# Undistorted image size (node keeps input resolution).
Camera.width: 1472
Camera.height: 1440

# Frame rate (measured 30.0 Hz on the raw Hilti bag /cam0/image_raw/compressed).
Camera.fps: 30

# Color order (ignored for grayscale input; the node decodes grayscale).
Camera.RGB: 1

#--------------------------------------------------------------------------------------------
# IMU Parameters  <- okvis2_share.yaml imu_parameters + cam0 T_SC.
#--------------------------------------------------------------------------------------------
# T_b_c1 = body(imu) <- cam0.  Unchanged by the R = I undistort (the virtual pinhole
# shares cam0's optical center and axis). == okvis2_share.yaml cam0 T_SC verbatim.
IMU.T_b_c1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [ 0.0186268922991908,   0.999791278707894,    -0.00839272916929751, -0.0141445202002632,
          -0.00299548177253861, -0.00833834361799002,  -0.999960748787001,   -0.0215291462288828,
          -0.999822017147164,    0.0186513014383221,    0.00283953912318657,  0.0254496559751759,
           0.0, 0.0, 0.0, 1.0]

# imu0 continuous-time noise densities  <- okvis2_share.yaml imu_parameters.
IMU.NoiseAcc:  0.00285891188   # m/s^1.5   (sigma_a_c,  accelerometer noise density)
IMU.NoiseGyro: 0.00047032046   # rad/s^0.5 (sigma_g_c,  gyro noise density)
IMU.AccWalk:   0.00130039805   # m/s^2.5   (sigma_aw_c, accelerometer random walk)
IMU.GyroWalk:  0.00036433633   # rad/s^1.5 (sigma_gw_c, gyro random walk)
# IMU rate: measured ~993 Hz on /imu/data_raw (nominal 1 kHz).
IMU.Frequency: 1000.0

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------
# More features than the 512x512 TUM-VI template: the Hilti fisheye is 1472x1440.
ORBextractor.nFeatures: 2000
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 20
ORBextractor.minThFAST: 7

#--------------------------------------------------------------------------------------------
# Viewer Parameters (viewer disabled at runtime / ORB_HEADLESS; kept for completeness)
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -3.5
Viewer.ViewpointF: 500.0
